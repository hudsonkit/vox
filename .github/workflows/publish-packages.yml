name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  providers:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin

      - name: Test provider protocol and adapters
        run: cargo +stable test --manifest-path providers/Cargo.toml --locked

      - name: Build provider bundles
        run: RUSTUP_TOOLCHAIN=stable bun run build:providers

      - name: Upload provider bundles
        uses: actions/upload-artifact@v4
        with:
          name: provider-binaries
          path: packages/cli/plugins/*/bin/**
          if-no-files-found: error

  publish:
    needs: providers
    runs-on: ubuntu-latest
    environment: PRODUCTION

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate tag version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          SDK_VERSION="$(node -p "require('./packages/client/package.json').version")"
          WEB_CLIENT_VERSION="$(node -p "require('./packages/web-client/package.json').version")"
          SWIFT_VERSION="$(sed -n 's/    public static let current = "\(.*\)"/\1/p' swift/Sources/VoxCore/RuntimePaths.swift)"

          for value in "$CLI_VERSION" "$SDK_VERSION" "$WEB_CLIENT_VERSION" "$SWIFT_VERSION"; do
            if [ "$value" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION does not match package/Swift version $value"
              exit 1
            fi
          done

      - name: Validate npm publishing config
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::Missing required release secret: NPM_TOKEN"
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run --cwd packages/client build && bun run --cwd packages/cli build && bun run --cwd packages/web-client build

      - name: Download provider bundles
        uses: actions/download-artifact@v4
        with:
          name: provider-binaries
          path: packages/cli/plugins

      - name: Restore executable permissions and verify provider bundles
        run: chmod +x packages/cli/plugins/*/bin/*/* && node packages/cli/scripts/verify-provider-bundles.mjs

      - name: Wait for matching Minivox release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")

          for attempt in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
              --jq '.assets[].name' 2>/dev/null | grep -qx 'Minivox.dmg'; then
              echo "Minivox v${VERSION} is available"
              exit 0
            fi
            echo "Waiting for the signed Minivox v${VERSION} release (${attempt}/120)…"
            sleep 30
          done

          echo "::error::Minivox v${VERSION} was not published within 60 minutes"
          exit 1

      - name: Publish @voxd/sdk if needed
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@voxd/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@voxd/sdk@$VERSION already exists on npm"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Publish @voxd/client if needed
        working-directory: packages/web-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@voxd/client@$VERSION" version >/dev/null 2>&1; then
            echo "@voxd/client@$VERSION already exists on npm"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Publish @voxd/cli if needed
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@voxd/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@voxd/cli@$VERSION already exists on npm"
            exit 0
          fi
          npm publish --access public --provenance
